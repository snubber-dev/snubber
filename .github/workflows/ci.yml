# The workflow is the second consumer of the one Node floor R-D-node-floor
# names — the action being the first — and it dogfoods action.yml on this
# repository before any stranger runs it.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege for every job, rather than whatever this repository's
# default happens to be. A job declaring its own permissions replaces this
# block rather than adding to it, which is why `publish` restates contents
# beside the id-token it needs.
permissions:
  contents: read

# Third-party actions are pinned to commit SHAs, never to tags: a tag is
# mutable and whoever controls the action's repository can retarget it, so a
# tag names an intention where a SHA names a tree. The trailing comment is the
# tag that SHA stood for when it was pinned, and dependabot rewrites both
# together — a pin with no update path only trades one exposure for another.
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The action this repository ships, run against the record it lives in.
      - uses: ./

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-node reads engines.node from package.json — the floor's one home.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
      # The `test` script is the battery's one home; spelling the runs out
      # here too would be a second copy to keep in step.
      - name: battery
        run: npm test
      - name: build
        run: |
          # Node 25 dropped corepack from the distribution; install it first.
          npm install -g corepack
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
      # Both trees, after install because tsc lives there. The build compiles
      # src only; test/ imports src and is checked nowhere else.
      - name: typecheck
        run: pnpm run typecheck
      # The CLI battery again, against the emit a consumer installs — the
      # dist target cannot run before this step, and never silently skips.
      - name: shipped cli
        run: node test/cli.ts dist
      - name: pack
        run: npm pack --dry-run

  # The release path, inert until a v* tag exists: nothing here runs on a
  # branch or a pull request. It stages, and a maintainer approves with 2FA —
  # the machine prepares and a person ratifies, which is the shape the record
  # uses everywhere else. npm's own "allowed actions" for this repository is
  # stage-only, so a compromised run cannot escalate into a live publish.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    # Both gates, or nothing is staged.
    needs: [record, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC credential trusted publishing mints. No token is stored for
      # this repository, and none is read here.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
      # The tag and the manifest are two homes for one version, and a release
      # is the one moment they must agree. This is the interlock that says so
      # before anything reaches the registry.
      - name: tag agrees with the manifest
        run: |
          manifest=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          [ "$manifest" = "$tag" ] || {
            echo "::error::tag $GITHUB_REF_NAME says $tag," \
                 "package.json says $manifest"
            exit 1
          }
      # corepack before the npm pin, not after: `corepack enable` writes shims
      # into the Node bin directory, and an npm shim landing there would
      # shadow a pin installed earlier. Pinned exactly for the same reason the
      # actions above are — an unpinned global install is arbitrary code in
      # the one job holding id-token: write.
      - name: install
        run: |
          npm install -g corepack@0.36.0
          corepack enable
          pnpm install --frozen-lockfile
      # Node ships npm 10; `npm stage publish` needs 11.15.0. The version
      # floats inside major 11 rather than pinning exactly, because nothing
      # can watch a version written in a run block — dependabot reads `uses:`
      # and manifests, never this — so an exact pin here would be one no
      # notification ever reaches, ageing quietly in the one job that holds
      # id-token: write. Floating inside the major takes npm's own security
      # releases as they land. The trust is unchanged either way: this is the
      # registry's own client, fetched from the registry it publishes to.
      #
      # The floor is asserted rather than assumed, which also catches an npm
      # shadowed on PATH — corepack's shims above being the way that happens.
      - name: npm that can stage
        run: |
          npm install -g npm@11
          floor=11.15.0
          have=$(npm --version)
          [ "$(printf '%s\n%s\n' "$floor" "$have" | sort -V | head -1)" = "$floor" ] || {
            echo "::error::npm is $have, below the $floor that" \
                 "\`npm stage publish\` needs"
            exit 1
          }
      # prepublishOnly is the release gate's one home — build, typecheck, both
      # batteries, the last against the emit a consumer installs. Measured
      # 2026-09-19: `npm stage publish` runs it, so the gate is not respelled
      # here; a second copy would be the thing that drifts.
      - name: stage
        run: npm stage publish
